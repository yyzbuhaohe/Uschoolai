<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>U 校园自动化控制台</title>
<style>
  :root{--bg:#0f1419;--card:#171d24;--line:#232c36;--fg:#e6edf3;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,'Segoe UI',system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{cursor:pointer;border:1px solid var(--line);background:#212a33;color:var(--fg);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600}
  button:hover{background:#2b3742}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.p{background:#1f6feb;border-color:#1f6feb}
  button.p:hover{background:#388bfd}
  button.d{background:#8b2c28;border-color:#8b2c28}
  button.w{background:#7d4e00;border-color:#7d4e00}
  .stat{display:flex;gap:20px;flex-wrap:wrap}
  .stat div{min-width:88px}
  .stat b{display:block;font-size:22px;font-weight:700;line-height:1.2}
  .stat span{color:var(--dim);font-size:11px}
  label{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1d242c;font-size:13px}
  label:last-child{border:0}
  input,select{background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:5px 9px;font-size:12px;width:150px}
  input[type=checkbox]{width:auto}
  #log{height:320px;overflow:auto;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .ln{color:#c9d1d9}
  .ln.ok{color:var(--ok)}
  .ln.err{color:var(--err)}
  .ln.warn{color:var(--warn)}
  .ln.dim{color:var(--dim)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px}
  .dot.run{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.stop{background:var(--err)}
  .dot.pause{background:var(--warn)}
  .full{grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">
  <h1>U 校园自动化控制台</h1>
  <div class="sub"><span class="dot" id="dot"></span><span id="stateText">读取中…</span></div>

  <div class="grid">
    <div class="card">
      <h2>控制</h2>
      <div class="row">
        <button class="p" id="btnStart">▶ 开始</button>
        <button class="w" id="btnPause">⏸ 暂停</button>
        <button class="d" id="btnStop">■ 停止</button>
      </div>
      <div class="row" style="margin-top:12px">
        <span style="color:var(--dim);font-size:12px">跑到第几节后停</span>
        <input id="maxSec" type="number" value="8" min="1" max="275" style="width:80px">
      </div>
    </div>

    <div class="card">
      <h2>进度</h2>
      <div class="stat">
        <div><b id="curSec">-</b><span>当前节</span></div>
        <div><b id="curScreen">-</b><span>当前屏</span></div>
        <div><b id="okCount">0</b><span>成功</span></div>
        <div><b id="failCount">0</b><span>失败</span></div>
      </div>
    </div>

    <div class="card">
      <h2>设置</h2>
      <label>模型 API Key <input id="apiKey" type="password" placeholder="sk-… 留空用已保存的" autocomplete="off"></label>
      <label>答题延迟 (ms) <input id="delay" type="number" value="900" min="300" max="5000"></label>
      <label>视频倍速 <input id="rate" type="number" value="4" min="1" max="8" step="0.5"></label>
      <label>图片题随机蒙 <input id="guess" type="checkbox" checked></label>
      <label>主观题写通用答案 <input id="filler" type="checkbox" checked></label>
    </div>

    <div class="card">
      <h2>环境检查</h2>
      <label>CDP (9222) <span id="chkCdp" class="dim">–</span></label>
      <label>本地服务 (8787) <span id="chkSrv" class="dim">–</span></label>
      <label>Whisper 模型 <span id="chkStt" class="dim">–</span></label>
      <label>当前页面 <span id="chkPage" class="dim" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">–</span></label>
    </div>

    <div class="card full">
      <h2>实时日志</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const API = '';

async function jget(p){ try{ const r = await fetch(API+p,{cache:'no-store'}); return await r.json(); }catch(e){ return null; } }
async function jpost(p,body){ try{ const r = await fetch(API+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})}); return await r.json(); }catch(e){ return null; } }

function render(st){
  if(!st) return;
  const s = st.state || 'stopped';
  const dot = $('#dot'); dot.className = 'dot ' + (s==='running'?'run':s==='paused'?'pause':'stop');
  $('#stateText').textContent = {running:'运行中',paused:'已暂停',stopped:'已停止'}[s] || s;
  $('#curSec').textContent = st.section || '-';
  $('#curScreen').textContent = st.screen || '-';
  $('#okCount').textContent = st.ok || 0;
  $('#failCount').textContent = st.fail || 0;
  $('#btnStart').disabled = s === 'running';
  $('#btnPause').disabled = s !== 'running';
  $('#chkCdp').textContent = st.cdp ? '正常' : '未连上';
  $('#chkCdp').className = st.cdp ? 'ok' : 'err';
  $('#chkSrv').textContent = st.srv ? '正常' : '未连上';
  $('#chkSrv').className = st.srv ? 'ok' : 'err';
  $('#chkStt').textContent = st.stt ? '就绪' : '未加载';
  $('#chkStt').className = st.stt ? 'ok' : 'err';
  $('#chkPage').textContent = st.page || '–';
  if (st.settings) {
    if (st.settings.delay && document.activeElement.id !== 'delay') $('#delay').value = st.settings.delay;
    if (st.settings.rate && document.activeElement.id !== 'rate') $('#rate').value = st.settings.rate;
  }
}

function pushLog(lines){
  const box = $('#log');
  if (!lines || !lines.length) return;
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  lines.forEach(l => {
    const div = document.createElement('div');
    div.className = 'ln ' + (l.cls || '');
    div.textContent = l.text || '';
    box.appendChild(div);
  });
  while (box.childNodes.length > 600) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

let lastLogId = 0;
async function tick(){
  const st = await jget('/api/state');
  render(st);
  const lg = await jget('/api/log?after=' + lastLogId);
  if (lg && lg.lines && lg.lines.length) {
    pushLog(lg.lines);
    lastLogId = lg.next || lastLogId;
  }
}

$('#btnStart').onclick = async () => {
  const r = await jpost('/api/run', { action:'start', maxSec: Number($('#maxSec').value)||8, delay: Number($('#delay').value)||900, rate: Number($('#rate').value)||4, guess: $('#guess').checked, filler: $('#filler').checked, apiKey: $('#apiKey').value });
  $('#apiKey').value = '';
  if (r && r.ok) console.log(r.already ? '已在跑 pid=' + r.pid : '已启动 pid=' + r.pid);
  else alert('启动失败：' + ((r && r.err) || '连不上本地服务 8787'));
  tick();
};
$('#btnPause').onclick = async () => { await jpost('/api/control',{action:'pause'}); tick(); };
$('#btnStop').onclick = async () => { await jpost('/api/run',{action:'stop'}); tick(); };

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
