<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>U 校园自动化控制台</title>
<style>
  :root{--bg:#0f1419;--card:#171d24;--line:#232c36;--fg:#e6edf3;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,'Segoe UI',system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{cursor:pointer;border:1px solid var(--line);background:#212a33;color:var(--fg);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600}
  button:hover{background:#2b3742}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.p{background:#1f6feb;border-color:#1f6feb}
  button.p:hover{background:#388bfd}
  button.d{background:#8b2c28;border-color:#8b2c28}
  button.w{background:#7d4e00;border-color:#7d4e00}
  .stat{display:flex;gap:20px;flex-wrap:wrap}
  .stat div{min-width:88px}
  .stat b{display:block;font-size:22px;font-weight:700;line-height:1.2}
  .stat span{color:var(--dim);font-size:11px}
  label{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1d242c;font-size:13px}
  label:last-child{border:0}
  input,select{background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:5px 9px;font-size:12px;width:150px}
  input[type=checkbox]{width:auto}
  #log{height:320px;overflow:auto;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .ln{color:#c9d1d9}
  .ln.ok{color:var(--ok)}
  .ln.err{color:var(--err)}
  .ln.warn{color:var(--warn)}
  .ln.dim{color:var(--dim)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px}
  .dot.run{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.stop{background:var(--err)}
  .dot.pause{background:var(--warn)}
  .ok{color:var(--ok)}
  .err{color:var(--err)}
  .warn{color:var(--warn)}
  .full{grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">
  <h1>U 校园自动化控制台</h1>
  <div class="sub"><span class="dot" id="dot"></span><span id="stateText">读取中…</span></div>

  <div class="grid">
    <div class="card">
      <h2>控制</h2>
      <div class="row">
        <button class="p" id="btnStart">▶ 开始</button>
        <button class="w" id="btnPause">⏸ 暂停</button>
        <button class="d" id="btnStop">■ 停止</button>
      </div>
      <div class="row" style="margin-top:12px">
        <span style="color:var(--dim);font-size:12px">跑到第几节后停</span>
        <input id="maxSec" type="number" value="8" min="1" max="275" style="width:80px">
      </div>
    </div>

    <div class="card">
      <h2>进度</h2>
      <div class="stat">
        <div><b id="curSec">-</b><span>当前节</span></div>
        <div><b id="curScreen">-</b><span>当前屏</span></div>
        <div><b id="okCount">0</b><span>成功</span></div>
        <div><b id="failCount">0</b><span>失败</span></div>
      </div>
    </div>

    <div class="card">
      <h2>设置</h2>
      <label>模型 API Key <input id="apiKey" type="password" placeholder="sk-… 留空用已保存的" autocomplete="off"></label>
      <label>答题延迟 (ms) <input id="delay" type="number" value="900" min="300" max="5000"></label>
      <label>视频倍速 <input id="rate" type="number" value="4" min="1" max="8" step="0.5"></label>
      <label>图片题随机蒙 <input id="guess" type="checkbox" checked></label>
      <label>主观题写通用答案 <input id="filler" type="checkbox" checked></label>
    </div>

    <div class="card">
      <h2>环境检查</h2>
      <label>CDP (9222) <span id="chkCdp" class="dim">–</span></label>
      <label>本地服务 (8787) <span id="chkSrv" class="dim">–</span></label>
      <label>Whisper 模型 <span id="chkStt" class="dim">–</span></label>
      <label>跑课进程 <span id="chkRunner" class="dim">–</span></label>
      <label>版本 <span id="chkVer" class="dim">–</span></label>
      <label>当前页面 <span id="chkPage" class="dim" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">–</span></label>
      <label>模型用量 <span id="chkUsage" class="dim">–</span></label>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="btnUpdate" class="ghost" style="flex:1">检查更新</button>
        <button id="btnForceUpdate" class="ghost" style="flex:1" title="忽略版本号比较，直接拿 main 覆盖本地代码">强制更新</button>
        <button id="btnUsageReset" class="ghost" style="flex:1">清零用量</button>
      </div>
      <div id="updateTip" style="display:none;margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5"></div>
    </div>

    <div class="card full">
      <h2>实时日志</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const API = '';

async function jget(p){ try{ const r = await fetch(API+p,{cache:'no-store'}); return await r.json(); }catch(e){ return null; } }

// 更新结果一律原样贴出来：以前 n=0 就一句「已经是最新版」，
// 把「远端缺 version.json」「网络被拦」「内容其实一样」三种完全不同的情况都说成了最新。
function showTip(text, kind){
  const box = document.getElementById('updateTip');
  if (!box) return;
  box.style.display = 'block';
  const color = kind === 'err' ? 'var(--err)' : kind === 'warn' ? 'var(--warn)' : 'var(--ok)';
  box.style.background = 'rgba(255,255,255,.04)';
  box.style.border = '1px solid ' + color;
  box.style.color = color;
  box.innerHTML = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\n/g, '<br>');
}

async function runUpdate(force){
  const bu = document.getElementById(force ? 'btnForceUpdate' : 'btnUpdate');
  const label = force ? '强制更新' : '检查更新';
  if (!confirm(force
      ? '强制更新：不管版本号，直接用 GitHub 上的 main 覆盖本地代码（control.json / 密钥 / 日志 / 模型不动，旧文件备份在 .bak-update/）。'
      : '从 GitHub 拉最新代码覆盖本地？\n\ncontrol.json / 密钥 / 日志都不会动，旧文件备份在 .bak-update/。')) return;
  bu.disabled = true; bu.textContent = '处理中…';
  const r = await jpost('/api/update', force ? { force: true } : {});
  bu.disabled = false; bu.textContent = label;
  if (!r) { showTip('连不上本地服务 8787，serve 窗口还开着吗？', 'err'); return; }
  const d = r.diag || {};
  const info = '本地 build ' + (r.local || d.local || '?') + ' / 远端 build ' + (d.remote || r.build || '?')
             + (d.zipBytes ? '（main.zip ' + Math.round(d.zipBytes / 1024) + ' KB，' + d.entries + ' 项）' : '');
  if (!r.ok) {
    showTip('更新失败：' + (r.err || '未知错误') + '\n' + info, 'err');
    alert('更新失败：' + (r.err || '未知错误') + '\n\n' + info);
    return;
  }
  if (!r.n) {
    // 关键：把服务端给的原因照抄出来，不再一律说「最新」
    showTip((r.msg || '没有文件变化') + '\n' + info, 'ok');
    return;
  }
  const list = r.changed.slice(0, 12).join('\n') + (r.changed.length > 12 ? '\n…' : '');
  showTip('已更新 ' + r.n + ' 个文件：' + (r.msg || '') + '\n' + info + '\n重启 serve.cmd 才生效（旧文件在 .bak-update/）', 'warn');
  alert('更新了 ' + r.n + ' 个文件：\n' + list + '\n\n' + (r.msg || '') + '\n\n备份在 .bak-update/，关掉 serve 窗口重开 serve.cmd 生效。');
}

document.addEventListener('DOMContentLoaded', () => {
  const bu = document.getElementById('btnUpdate');
  if (bu) bu.onclick = () => runUpdate(false);
  const bf = document.getElementById('btnForceUpdate');
  if (bf) bf.onclick = () => runUpdate(true);
  const br = document.getElementById('btnUsageReset');
  if (br) br.onclick = async () => {
    if (!confirm('用量清零？之后重新累计。')) return;
    await jpost('/api/usage/reset', {});
    location.reload();
  };
});

async function jpost(p,body){ try{ const r = await fetch(API+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})}); return await r.json(); }catch(e){ return null; } }

function render(st){
  if(!st) return;
  const s = st.state || 'stopped';
  const u = st.usage;
  if (u && $('#chkUsage')) {
    $('#chkUsage').textContent = u.calls
      ? u.calls + ' 次 · ' + (u.in + u.out) + ' token · 约 ' + u.cost.toFixed(3) + ' 元'
      : '还没用过';
  }
  const dot = $('#dot'); dot.className = 'dot ' + (s==='running'?'run':s==='paused'?'pause':'stop');
  let stTxt = {running:'运行中',paused:'已暂停',stopped:'已停止'}[s] || s;
  // 状态字段说在跑、进程却没了（杀毒/手动任务管理器/崩溃）—— 直接说清楚，别让人对着「运行中」干等
  if (!st.runner && (s === 'running')) stTxt = '运行中（但进程已经没了，点开始重起）';
  $('#stateText').textContent = stTxt;
  $('#curSec').textContent = st.section || '-';
  $('#curScreen').textContent = st.screen || '-';
  $('#okCount').textContent = st.ok || 0;
  $('#failCount').textContent = st.fail || 0;
  $('#btnStart').disabled = s === 'running' || st.runner === true;
  $('#btnPause').disabled = s !== 'running';
  if ($('#chkRunner')) {
    $('#chkRunner').textContent = st.runner ? ('在跑 pid ' + (st.runnerPid || '?')) : '没在跑';
    $('#chkRunner').className = st.runner ? 'ok' : 'dim';
  }
  // 版本 + 「磁盘已更新但进程还是旧代码」——这是更新完看不出效果的头号原因
  if ($('#chkVer')) {
    const nm = st.buildName || '?';
    const bd = st.build || 0;
    const db = st.diskBuild || bd;
    if (st.stale) {
      $('#chkVer').textContent = '磁盘 ' + db + ' / 进程 ' + bd + '（要重启）';
      $('#chkVer').className = 'warn';
      // 只在"刚发现"时提示一次：render 每 2 秒跑一次，别把更新结果刷掉
      if (!window.__staleTipShown) {
        window.__staleTipShown = true;
        showTip('代码已经更新到 build ' + db + '，但当前这个进程还跑着 build ' + bd + '。\n关掉 serve 窗口，重开 serve.cmd 才生效。', 'warn');
      }
    } else {
      window.__staleTipShown = false;
      $('#chkVer').textContent = nm + '（build ' + db + '）';
      $('#chkVer').className = 'ok';
    }
  }
  $('#chkCdp').textContent = st.cdp ? '正常' : '未连上';
  $('#chkCdp').className = st.cdp ? 'ok' : 'err';
  $('#chkSrv').textContent = st.srv ? '正常' : '未连上';
  $('#chkSrv').className = st.srv ? 'ok' : 'err';
  $('#chkStt').textContent = st.stt ? '就绪' : '未加载';
  $('#chkStt').className = st.stt ? 'ok' : 'err';
  $('#chkPage').textContent = st.page || '–';
  if (st.settings) {
    if (st.settings.delay && document.activeElement.id !== 'delay') $('#delay').value = st.settings.delay;
    if (st.settings.rate && document.activeElement.id !== 'rate') $('#rate').value = st.settings.rate;
  }
}

function pushLog(lines){
  const box = $('#log');
  if (!lines || !lines.length) return;
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  lines.forEach(l => {
    const div = document.createElement('div');
    div.className = 'ln ' + (l.cls || '');
    div.textContent = l.text || '';
    box.appendChild(div);
  });
  while (box.childNodes.length > 600) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

let lastLogId = 0;
async function tick(){
  const st = await jget('/api/state');
  render(st);
  const lg = await jget('/api/log?after=' + lastLogId);
  if (lg && lg.lines && lg.lines.length) {
    pushLog(lg.lines);
    lastLogId = lg.next || lastLogId;
  }
}

function note(text, cls){
  pushLog([{ text: '[' + new Date().toLocaleTimeString() + '] ' + text, cls: cls || 'dim' }]);
}

// 点了停止之后要能看见结果：老版本只发一个 POST 就完事，
// 进程要是没退（孤儿/dub.js 卡住），界面照样回到「运行中」，用户以为按钮坏了。
async function waitStopped(ms){
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    const st = await jget('/api/state');
    if (st && !st.runner) return st;
    await new Promise(r => setTimeout(r, 600));
  }
  return await jget('/api/state');
}

$('#btnStart').onclick = async () => {
  $('#btnStart').disabled = true;
  const r = await jpost('/api/run', { action:'start', maxSec: Number($('#maxSec').value)||8, delay: Number($('#delay').value)||900, rate: Number($('#rate').value)||4, guess: $('#guess').checked, filler: $('#filler').checked, apiKey: $('#apiKey').value });
  $('#apiKey').value = '';
  if (r && r.ok) note(r.already ? '这个进程已经在跑了（pid ' + r.pid + '），没有重复启动' : '已启动 pid ' + r.pid, 'ok');
  else note('启动失败：' + ((r && r.err) || '连不上本地服务 8787'), 'err');
  await tick();
};
$('#btnPause').onclick = async () => {
  const r = await jpost('/api/control',{action:'pause'});
  note(r && r.ok ? '已请求暂停（正在做的这一小步做完就停）' : '暂停失败：连不上 8787', r && r.ok ? 'warn' : 'err');
  tick();
};
$('#btnStop').onclick = async () => {
  $('#btnStop').disabled = true;
  const r = await jpost('/api/run',{action:'stop'});
  if (!r) note('停止失败：连不上本地服务 8787', 'err');
  else if (r.already) note('本来就没在跑', 'dim');
  else {
    const st = await waitStopped(8000);
    if (st && !st.runner) note(r.graceful ? '已停止（进程自己退的）' : '已停止（进程没响应，已强杀 pid ' + r.pid + '）', 'ok');
    else note('进程还没退（pid ' + r.pid + '）：在跑 dub.js 转写时可能要多等几秒，还不行就双击 stop-all.cmd', 'warn');
  }
  $('#btnStop').disabled = false;
  tick();
};

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
